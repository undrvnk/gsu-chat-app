# Nginx reverse proxy for GSU CS Grad Portal.
# Listens on the public port (default 5000) so your existing router rule still works.
# Serves /static/ directly and proxies pages to gunicorn on 127.0.0.1:8000.

server {
    listen 5000 default_server;
    listen [::]:5000 default_server;
    server_name _;

    client_max_body_size 8M;

    location /static/ {
        alias /home/jason/gsu-chat-app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
